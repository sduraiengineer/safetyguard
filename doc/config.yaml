# =========================
# SafetyGuard Configuration
#
# All config parameter are lower case seperated by "_" if required.
# =========================

config_version: 1

global:
  log_level: info
  check_interval_ms: 500 # cyclic time to check states of apps
  state_file: /var/lib/safetyguard/state.yaml
  log_file: /var/log/safetyguard.log
  init_file: /etc/safetygurad/config.yaml
  init_file_gen: /var/lib/safetyguard/gen_config.yaml
  mode: production # Can be development. In case of development, the app configuration
                      # will be generated which can act as guidance, for example heartbeat_interval_ms as average heartbeat
  endpoint: /tmp/safetyguard.sock

watchdog:
  device: /dev/watchdog
  timeout_sec: 10
  pretimeout_sec: 5
  kick_interval_ms: 3000

recover:
  system_reset_on_failure: true
  max_global_failures: 5

system_apps:
  - name: systemd
    max_retries: 3
    critical: true
    manager:
      type: native-sytemd
      config:
    safemonitor:
      - type: hearbeat
        sub-type: main
        config:
           heartbeat_interval_ms: 1000
    safeaction:
      - type: native-systemd
        config:
          restart: true
apps:
  - name: app_a
    max_retries: 3
    critical: true
    manager:
      type: systemd
      config:
        unit-file: app_a
    safemonitor:
      - type: hearbeat
        sub-type: main
        config:
           heartbeat_interval_ms: 1000
    safeaction:
      - type: systemd
        config:
          restart: true
    safeinstrument:
      - type: checkpoint
        config:
           checkpoint-A: 1
           checkpoint-B: 2
      - type: statemachine
        config:
           state-A: init
           state-B: running
           state-c: stopped

  - name: app_b
    timeout_ms: 2000
    max_retries: 5
    critical: false
    manager:
      type: docker
      config:
        contianer-name: app_b
